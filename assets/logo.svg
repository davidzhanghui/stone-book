<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2C37"/>
      <stop offset="0.55" stop-color="#22586A"/>
      <stop offset="1" stop-color="#3E8196"/>
    </linearGradient>
    <radialGradient id="d-glow" cx="0.26" cy="0.14" r="0.82">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="d-stone" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FAFCFB"/>
      <stop offset="0.55" stop-color="#E8F1EF"/>
      <stop offset="1" stop-color="#C7DBD9"/>
    </linearGradient>
    <filter id="d-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#051A20" flood-opacity="0.40"/>
    </filter>
    <clipPath id="d-clip">
      <rect x="286" y="286" width="452" height="452" rx="100"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#d-bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#d-glow)"/>

  <!-- 石 -->
  <g filter="url(#d-shadow)">
    <rect x="286" y="286" width="452" height="452" rx="100" fill="url(#d-stone)"/>
  </g>

  <g clip-path="url(#d-clip)">
    <!-- 石面高光 -->
    <path d="M300 360 Q300 310 350 310 H520 Q482 330 468 366 Q444 428 380 462 Q330 486 312 456 Z"
          fill="#FFFFFF" opacity="0.42"/>

    <!-- 凿出的渠槽 -->
    <path d="M368 270 C 368 400 652 424 652 552 C 652 650 520 690 520 760"
          fill="none" stroke="#123845" stroke-width="82" stroke-linecap="round"/>
    <!-- 渠水 -->
    <path d="M368 270 C 368 400 652 424 652 552 C 652 650 520 690 520 760"
          fill="none" stroke="#6FD3E8" stroke-width="44" stroke-linecap="round"/>
    <!-- 水面高光 -->
    <path d="M368 270 C 368 400 652 424 652 552 C 652 650 520 690 520 760"
          fill="none" stroke="#D8F8FF" stroke-width="11" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>
